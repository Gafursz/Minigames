name: Creative extension checks

on:
  push:
    branches: [creative-extension]
  pull_request:
    branches: [story-4]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:tests
      - run: npm run test:coverage
      - run: npm run build
